<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rateio.me</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Rateio.me</h1>
    </header>
    <main>
        <form id="rateioForm">
            <label for="eventName">Event Name:</label><br>
            <input type="text" id="eventName" required><br><br>

            <label for="eventCost">Event Cost:</label><br>
            <input type="number" step="0.01" id="eventCost" required><br><br>

            <label for="serviceChargePercent">Service Charge Percent:</label><br>
            <input type="number" step="0.01" id="serviceChargePercent" required><br><br>

            <label for="groupSize">Group Size:</label><br>
            <input type="number" min="2" max="100" id="groupSize" required><br><br>

            <button type="submit">Calculate Split</button>
        </form>
        <div id="result"></div>
    </main>
    <script src="script.js"></script>
</body>
</html>
