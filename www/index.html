<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rateio.me</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <form id="rateioForm">
            <label for="eventName">Nome do Evento:</label><br>
            <input type="text" id="eventName" required><br><br>

            <label for="eventCost">Custo:</label><br>
            <input type="number" step="0.01" id="eventCost" required><br><br>

            <label for="serviceChargePercent">Taxas:</label><br>
            <input type="number" step="0.01" id="serviceChargePercent" required><br><br>

            <label for="groupSize">Quantidade de pessoas:</label><br>
            <input type="number" min="2" max="100" id="groupSize" required><br><br>

            <button type="submit">Calcular Rateio</button>
        </form>
        <div id="result"></div>
    </main>
    <script src="script.js"></script>
</body>
</html>
